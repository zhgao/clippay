app = "clippay"
primary_region = "sin"  # Singapore: low latency for Asia, same as Transcriptly

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Uploads must survive redeploys: the app dir is replaced on every
  # deploy, but /data is the persistent volume (see [[mounts]] below).
  # Old jobs keep the stored_path recorded at upload time, so videos
  # uploaded before this change stay unresolvable on the new machine.
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "clippay_data"
  destination = "/data"
